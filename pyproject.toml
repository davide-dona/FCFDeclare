[project]
name = "fcfdeclare"
version = "0.1.0"
description = "Fast Control-Flow Declare: vectorized mining and checking of Declare models"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Davide Dona" }]
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
]
keywords = ["declare", "process mining", "conformance checking", "event logs"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/davide-dona/FCFDeclare"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.1",
]

[build-system]
requires = ["uv_build>=0.11.14,<0.12"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["src"]
addopts = "--doctest-modules"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
    "N",   # pep8-naming
]

[tool.ruff.format]
quote-style = "single"
